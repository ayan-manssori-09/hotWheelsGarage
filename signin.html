<!DOCTYPE html>
<html class="dark" lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Sign In | HotWheels Garage</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Hanken+Grotesk:wght@400;500&amp;family=JetBrains+Mono:wght@700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(18, 18, 18, 0.8);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            border-color: #ff5b00;
            transform: translateY(-4px);
        }
        .inner-glow {
            box-shadow: inset 1px 1px 0px rgba(255, 255, 255, 0.1);
        }
        .spotlight-orange {
            background: radial-gradient(circle at center, rgba(255, 91, 0, 0.15) 0%, transparent 70%);
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #080808; }
        ::-webkit-scrollbar-thumb { background: #ff5b00; border-radius: 10px; }

        /* Entrance Animations */
        @keyframes fadeSlideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeSlideLeft {
            from { opacity: 0; transform: translateX(-30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes fadeSlideRight {
            from { opacity: 0; transform: translateX(30px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes glowPulse {
            0%, 100% { box-shadow: 0 0 5px rgba(255, 91, 0, 0.3); }
            50% { box-shadow: 0 0 20px rgba(255, 91, 0, 0.6), 0 0 40px rgba(255, 91, 0, 0.3); }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }
        @keyframes spinSlow {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes borderGlow {
            0%, 100% { border-color: rgba(255, 91, 0, 0.3); }
            50% { border-color: rgba(255, 91, 0, 0.8); }
        }
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }

        .animate-fade-up { animation: fadeSlideUp 0.8s ease-out forwards; }
        .animate-fade-left { animation: fadeSlideLeft 0.8s ease-out forwards; }
        .animate-fade-right { animation: fadeSlideRight 0.8s ease-out forwards; }
        .animate-glow { animation: glowPulse 2s ease-in-out infinite; }
        .animate-float { animation: float 3s ease-in-out infinite; }
        .animate-spin-slow { animation: spinSlow 20s linear infinite; }
        .animate-border-glow { animation: borderGlow 2s ease-in-out infinite; }
        .animate-shimmer {
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            background-size: 200% 100%;
            animation: shimmer 2s ease-in-out infinite;
        }

        .stagger-1 { animation-delay: 0.1s; opacity: 0; }
        .stagger-2 { animation-delay: 0.2s; opacity: 0; }
        .stagger-3 { animation-delay: 0.3s; opacity: 0; }
        .stagger-4 { animation-delay: 0.4s; opacity: 0; }
        .stagger-5 { animation-delay: 0.5s; opacity: 0; }
        .stagger-6 { animation-delay: 0.6s; opacity: 0; }

        .input-field {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }
        .input-field:focus {
            border-color: #ff5b00;
            box-shadow: 0 0 0 3px rgba(255, 91, 0, 0.2);
            outline: none;
        }
        .input-field:hover {
            border-color: rgba(255, 91, 0, 0.5);
        }
    </style>
<script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "surface-container-highest": "#353534",
                        "on-secondary-container": "#002661",
                        "error": "#ffb4ab",
                        "on-secondary-fixed": "#001945",
                        "on-tertiary-container": "#5f0000",
                        "on-surface-variant": "#e4beb1",
                        "primary": "#ffb59a",
                        "primary-container": "#ff5b00",
                        "on-primary-fixed-variant": "#802a00",
                        "outline": "#ab897d",
                        "surface-container-lowest": "#0e0e0e",
                        "on-tertiary-fixed-variant": "#930100",
                        "on-tertiary-fixed": "#410000",
                        "primary-fixed": "#ffdbce",
                        "on-error-container": "#ffdad6",
                        "secondary-fixed-dim": "#b0c6ff",
                        "on-surface": "#e5e2e1",
                        "surface-tint": "#ffb59a",
                        "surface-variant": "#353534",
                        "on-primary": "#5b1b00",
                        "secondary-container": "#568dff",
                        "tertiary": "#ffb4a8",
                        "tertiary-fixed": "#ffdad4",
                        "primary-fixed-dim": "#ffb59a",
                        "tertiary-container": "#ff5944",
                        "outline-variant": "#5b4137",
                        "inverse-surface": "#e5e2e1",
                        "on-secondary": "#002d6f",
                        "on-secondary-fixed-variant": "#00429c",
                        "background": "#131313",
                        "surface-container-high": "#2a2a2a",
                        "on-tertiary": "#690000",
                        "on-background": "#e5e2e1",
                        "secondary-fixed": "#d9e2ff",
                        "surface-bright": "#393939",
                        "on-error": "#690005",
                        "error-container": "#93000a",
                        "surface-container-low": "#1c1b1b",
                        "secondary": "#b0c6ff",
                        "surface-container": "#201f1f",
                        "surface-dim": "#131313",
                        "on-primary-container": "#521800",
                        "inverse-on-surface": "#313030",
                        "tertiary-fixed-dim": "#ffb4a8",
                        "inverse-primary": "#a83900",
                        "on-primary-fixed": "#380d00",
                        "surface": "#131313"
                    },
                    borderRadius: {
                        DEFAULT: "0.125rem",
                        lg: "0.25rem",
                        xl: "0.5rem",
                        full: "0.75rem"
                    },
                    fontFamily: {
                        "body-md": ["Hanken Grotesk"],
                        "headline-md": ["Sora"],
                        "label-caps": ["JetBrains Mono"],
                        "body-lg": ["Hanken Grotesk"],
                        "display-lg": ["Sora"],
                        "headline-lg": ["Sora"],
                    },
                    fontSize: {
                        "body-md": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "headline-md": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.15em", "fontWeight": "700"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "display-lg": ["72px", {"lineHeight": "1.1", "letterSpacing": "-0.04em", "fontWeight": "800"}],
                        "headline-lg": ["32px", {"lineHeight": "1.2", "fontWeight": "700"}],
                    }
                },
            },
        }
    </script>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex items-center justify-center relative overflow-hidden">
    <!-- Background Effects -->
    <div class="absolute inset-0 z-0">
        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-primary-container/10 rounded-full blur-[120px] animate-float"></div>
        <div class="absolute bottom-1/4 right-1/4 w-80 h-80 bg-secondary/10 rounded-full blur-[100px] animate-float" style="animation-delay: 1.5s;"></div>
        <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[600px] h-[600px] bg-primary-container/5 rounded-full blur-[150px] animate-spin-slow"></div>
    </div>

    <!-- Back to Home -->
    <a href="index.html" class="fixed top-6 left-6 z-50 flex items-center gap-2 text-on-surface-variant hover:text-primary-container transition-colors group stagger-1 animate-fade-left">
        <span class="material-symbols-outlined group-hover:-translate-x-1 transition-transform">arrow_back</span>
        <span class="font-label-caps text-label-caps">Back to Garage</span>
    </a>

    <!-- Sign In Card -->
    <div class="relative z-10 w-full max-w-md px-4">
        <div class="glass-card inner-glow p-8 md:p-10 rounded-lg stagger-2 animate-fade-up">
            <!-- Logo / Brand -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-primary-container/20 mb-4 animate-glow">
                    <span class="material-symbols-outlined text-primary-container text-3xl">directions_car</span>
                </div>
                <h1 class="font-headline-lg text-headline-lg text-on-surface">Welcome Back</h1>
                <p class="font-body-md text-on-surface-variant mt-2">Sign in to your collector's garage</p>
            </div>

            <!-- Form -->
            <form class="space-y-5" onsubmit="return false;">
                <div class="stagger-3 animate-fade-up">
                    <label class="font-label-caps text-label-caps text-on-surface-variant block mb-2">EMAIL ADDRESS</label>
                    <input type="email" placeholder="collector@hotwheels.com" class="input-field w-full px-4 py-3 font-body-md text-on-surface rounded placeholder:text-on-surface-variant/40"/>
                </div>
                <div class="stagger-4 animate-fade-up">
                    <div class="flex justify-between items-center mb-2">
                        <label class="font-label-caps text-label-caps text-on-surface-variant">PASSWORD</label>
                        <a href="#" class="font-label-caps text-[10px] text-primary-container hover:underline">Forgot?</a>
                    </div>
                    <input type="password" placeholder="••••••••" class="input-field w-full px-4 py-3 font-body-md text-on-surface rounded placeholder:text-on-surface-variant/40"/>
                </div>
                <div class="flex items-center gap-3 stagger-5 animate-fade-up">
                    <input type="checkbox" id="remember" class="w-4 h-4 rounded border-white/20 bg-white/5 text-primary-container focus:ring-primary-container"/>
                    <label for="remember" class="font-body-md text-sm text-on-surface-variant">Remember me</label>
                </div>
                <button type="submit" class="w-full py-4 bg-primary-container text-on-primary-container font-label-caps text-label-caps hover:brightness-110 transition-all relative overflow-hidden group stagger-6 animate-fade-up">
                    <span class="relative z-10 flex items-center justify-center gap-2">
                        Sign In
                        <span class="material-symbols-outlined group-hover:translate-x-1 transition-transform">arrow_forward</span>
                    </span>
                    <div class="absolute inset-0 animate-shimmer"></div>
                </button>
            </form>

            <!-- Divider -->
            <div class="flex items-center gap-4 my-6 stagger-5 animate-fade-up">
                <div class="flex-1 h-px bg-white/10"></div>
                <span class="font-label-caps text-label-caps text-on-surface-variant/50">OR</span>
                <div class="flex-1 h-px bg-white/10"></div>
            </div>

            <!-- Social Buttons -->
            <div class="grid grid-cols-2 gap-3 stagger-6 animate-fade-up">
                <button class="flex items-center justify-center gap-2 py-3 border border-white/10 hover:bg-white/5 transition-all font-label-caps text-label-caps text-on-surface-variant">
                    <span class="material-symbols-outlined text-sm">account_circle</span>
                    Google
                </button>
                <button class="flex items-center justify-center gap-2 py-3 border border-white/10 hover:bg-white/5 transition-all font-label-caps text-label-caps text-on-surface-variant">
                    <span class="material-symbols-outlined text-sm">smartphone</span>
                    Apple
                </button>
            </div>

            <!-- Sign Up Link -->
            <p class="text-center mt-8 font-body-md text-sm text-on-surface-variant stagger-6 animate-fade-up">
                Don't have an account?
                <a href="#" class="text-primary-container hover:underline font-semibold">Create one</a>
            </p>
        </div>

        <!-- Footer Text -->
        <p class="text-center mt-6 font-label-caps text-[10px] text-on-surface-variant/40 stagger-6 animate-fade-up">
            By signing in, you agree to our Terms of Service and Privacy Policy
        </p>
    </div>

    <script>
        // Trigger stagger animations on load
        document.addEventListener('DOMContentLoaded', () => {
            const staggerEls = document.querySelectorAll('[class*="stagger-"]');
            staggerEls.forEach(el => {
                const classes = el.className.split(' ');
                const staggerClass = classes.find(c => c.startsWith('stagger-'));
                if (staggerClass) {
                    const delay = parseFloat(staggerClass.split('-')[1]) * 1000;
                    setTimeout(() => {
                        el.style.opacity = '1';
                    }, delay);
                }
            });
        });

        // Form interaction
        const form = document.querySelector('form');
        const submitBtn = form.querySelector('button[type="submit"]');
        submitBtn.addEventListener('click', () => {
            submitBtn.innerHTML = '<span class="material-symbols-outlined animate-spin">refresh</span> Signing In...';
            setTimeout(() => {
                submitBtn.innerHTML = '<span class="material-symbols-outlined">check_circle</span> Welcome Back!';
                submitBtn.classList.add('bg-green-600');
            }, 1500);
        });
    </script>
</body>
</html>
